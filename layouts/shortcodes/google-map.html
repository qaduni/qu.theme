{{ $src    := .Get "src"    | default hugo.Data.site.global.campus_map_embed }}
{{ $width  := .Get "width"  | default "100%" }}
{{ $height := .Get "height" | default "400" }}
{{ $title  := .Get "title"  | default (i18n "map_title") }}
{{ if $src }}
<div class="mapembed">
  <iframe
    src="{{ $src | safeURL }}"
    width="{{ $width }}"
    height="{{ $height }}"
    title="{{ $title }}"
    style="border:0;"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="noreferrerwhendowngrade"></iframe>
</div>
{{ end }}
