{{ $data := index hugo.Data.homepage .Language.Lang "quick_links" }}
{{ with $data }}
<section class="section">
    <div class="container">
        <div class="section-header reveal">
            {{ with .title }}<h2>{{ . }}</h2>{{ end }}
            {{ with .sub_title }}<p>{{ . }}</p>{{ end }}
        </div>

        <div class="quick-links">
            {{ range $i, $e := .items }}
            <a href="{{ .url }}"{{ if .params.external }} target="_blank" rel="noopener"{{ end }} class="quick-link reveal" style="--reveal-delay: {{ mul $i 60 }}ms;">
                {{ with .params.icon }}
                <div class="quick-link-icon">
                    <svg width="24" height="24"><use href="#icon-{{ . }}"></use></svg>
                </div>
                {{ end }}
                <span class="quick-link-text">{{ .name }}</span>
            </a>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
