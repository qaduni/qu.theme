<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="icon-leaf" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M54 6 C 32 6 12 22 10 44 c -1 8 2 14 8 14 C 40 58 58 38 58 14 c 0 -3 -1 -6 -4 -8 Z" fill="currentColor" fill-opacity=".18"/>
        <path d="M54 6 C 32 6 12 22 10 44 c -1 8 2 14 8 14 C 40 58 58 38 58 14 c 0 -3 -1 -6 -4 -8 Z"/>
        <path d="M14 56 C 26 40 38 28 54 18"/>
    </symbol>
</svg>

{{ $logo := resources.Get "images/uni_logo.webp" }}
{{ if not $logo }}
    {{ $logo = resources.Get "images/uni_logo.png" }}
{{ end }}

<section class="section sdg-section">
    <div class="container">
        <div class="sdg-card reveal">
            <div class="sdg-card__leaves" aria-hidden="true">
                <svg class="sdg-leaf sdg-leaf--tl" viewBox="0 0 64 64"><use href="#icon-leaf"/></svg>
                <svg class="sdg-leaf sdg-leaf--tr" viewBox="0 0 64 64"><use href="#icon-leaf"/></svg>
                <svg class="sdg-leaf sdg-leaf--bl" viewBox="0 0 64 64"><use href="#icon-leaf"/></svg>
                <svg class="sdg-leaf sdg-leaf--br" viewBox="0 0 64 64"><use href="#icon-leaf"/></svg>
            </div>

            <div class="sdg-card__body">
                <span class="sdg-badge">
                    <svg width="16" height="16" aria-hidden="true"><use href="#icon-leaf"/></svg>
                    {{ i18n "sdg_badge" }}
                </span>
                <h3>{{ i18n "sdg_title" }}</h3>
                <p>{{ i18n "sdg_subtitle" }}</p>
                <a href="https://sust.qu.edu.iq/" class="btn sdg-btn btn-lg" target="_blank" rel="noopener">
                    <svg width="20" height="20" aria-hidden="true"><use href="#icon-globe"></use></svg>
                    {{ i18n "sdg_cta" }}
                </a>
            </div>

            <div class="sdg-card__visual" aria-hidden="true">
                <svg class="sdg-visual" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="sdg-earth" cx="40%" cy="40%" r="65%">
                            <stop offset="0%" stop-color="#7ed4a0"/>
                            <stop offset="55%" stop-color="#2e8b57"/>
                            <stop offset="100%" stop-color="#0f5132"/>
                        </radialGradient>
                        <linearGradient id="sdg-leaf-grad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#a7e3b8"/>
                            <stop offset="100%" stop-color="#2e8b57"/>
                        </linearGradient>
                        <!-- Soft glow backdrop for logo readability -->
                        <radialGradient id="sdg-logo-glow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                        </radialGradient>
                    </defs>

                    <!-- Green Earth Sphere -->
                    <circle cx="120" cy="120" r="92" fill="url(#sdg-earth)"/>

                    <!-- Logo Glow & Image -->
                    {{ with $logo }}
                        <circle cx="120" cy="120" r="55" fill="url(#sdg-logo-glow)"/>
                        <image href="{{ .RelPermalink }}" x="38" y="38" width="165" height="165" preserveAspectRatio="xMidYMid meet" opacity="0.95"/>
                    {{ end }}

                    <!-- Overlapping Decorative Leaves -->
                    <g transform="translate(120 32) rotate(-18)">
                        <path d="M0 0 C 28 -8 56 14 64 56 C 32 60 4 38 0 0 Z" fill="url(#sdg-leaf-grad)"/>
                        <path d="M2 6 C 22 18 42 36 58 52" fill="none" stroke="#0f5132" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
                    </g>
                    <g transform="translate(40 178) rotate(165)">
                        <path d="M0 0 C 22 -6 44 10 50 44 C 26 48 4 30 0 0 Z" fill="url(#sdg-leaf-grad)" opacity=".9"/>
                    </g>
                    <g transform="translate(206 188) rotate(28)">
                        <path d="M0 0 C 18 -4 36 8 42 36 C 22 40 4 24 0 0 Z" fill="url(#sdg-leaf-grad)" opacity=".85"/>
                    </g>
                </svg>
            </div>
        </div>
    </div>
</section>
