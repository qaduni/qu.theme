<link rel="preload" href="/pagefind/pagefind-component-ui.css" as="style" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/pagefind/pagefind-component-ui.css"></noscript>

<script src="/pagefind/pagefind-component-ui.js" type="module" async></script>

<section class="section">
    <div class="container">
        <div class="section-header reveal">
            <h2>{{ i18n "search_section_title" }}</h2>
            <p>{{ i18n "search_section_subtitle" }}</p>
        </div>

        <div class="searchbox">
            <pagefind-searchbox 
                style="width: 100%;" 
                placeholder="{{ i18n `search_global` }}" 
                aria-label="{{ i18n `search_global` }}"
                max-results="10">
            </pagefind-searchbox>
            <pagefind-filter-dropdown 
                filter="category" 
                label="{{ i18n `filter_label` }}"
                aria-label="{{ i18n `filter_label` }}">
            </pagefind-filter-dropdown>
        </div>
    </div>
</section>
