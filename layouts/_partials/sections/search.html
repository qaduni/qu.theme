{{ $homepageData := index hugo.Data.homepage .Language.Lang }}

<link href="/pagefind/pagefind-component-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-component-ui.js"></script>

<script>
    const { configureInstance } = window.PagefindComponents;

    // Translated site configurations using Hugo i18n
    const allSites = [
        { name: {{ i18n "site_main" | default "Main Site" }}, url: "https://test.qu.edu.iq" },
        { name: {{ i18n "site_qa" | default "QA Site" }}, url: "https://qa.qu.edu.iq" },
        { name: {{ i18n "site_scr" | default "SCR Site" }}, url: "https://scr.qu.edu.iq" }
    ];

    const currentOrigin = window.location.origin.toLowerCase();
    const currentSite = allSites.find(s => s.url.toLowerCase() === currentOrigin);
    const externalSites = allSites.filter(s => s.url.toLowerCase() !== currentOrigin);
    const currentSiteName = currentSite ? currentSite.name : allSites[0].name;

    configureInstance("default", {
        mergeFilter: {
            site: currentSiteName
        },
        mergeIndex: externalSites.map(site => ({
            bundlePath: `${site.url.replace(/\/$/, "")}/pagefind`,
            mergeFilter: {
                site: site.name
            }
        }))
    });

    // Automatically attach data-site attribute to rendered result links for badges
    const badgeObserver = new MutationObserver(() => {
        document.querySelectorAll('pagefind-searchbox a:not([data-site])').forEach(link => {
            const href = link.href.toLowerCase();
            const matchedSite = allSites.find(s => {
                try {
                    return href.includes(new URL(s.url).hostname);
                } catch {
                    return false;
                }
            });
            
            link.dataset.site = matchedSite ? matchedSite.name : currentSiteName;
        });
    });

    window.addEventListener("DOMContentLoaded", () => {
        const searchBox = document.querySelector(".searchbox");
        if (searchBox) {
            badgeObserver.observe(searchBox, { childList: true, subtree: true });
        }
    });
</script>

<section class="section">
    <div class="container">
        <div class="section-header reveal">
            <h2>{{ $homepageData.search.title }}</h2>
            <p>{{ $homepageData.search.sub_title }}</p>
        </div>

        <div class="searchbox">
            <pagefind-config preload></pagefind-config>
            <pagefind-searchbox 
                style="width: 100%;" 
                placeholder="{{ $homepageData.search.placeholder }}" 
                aria-label="{{ $homepageData.search.title }}"
                max-results="10">
            </pagefind-searchbox>

            <!-- Category Filter -->
            <pagefind-filter-dropdown 
                filter="category" 
                label="{{ i18n `filter_label` }}">
            </pagefind-filter-dropdown>

            <!-- 1. Site Filter Dropdown with Translated Label -->
            <pagefind-filter-dropdown 
                filter="site" 
                label="{{ i18n `filter_site_label` }}">
            </pagefind-filter-dropdown>
        </div>
    </div>
</section>
