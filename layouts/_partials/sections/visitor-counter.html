<section class="visitor-counter-section">
    <div class="container">
        <div class="visitor-counter">
            <div class="counter-item">
                <svg width="28" height="28" aria-hidden="true">
                    <use href="#icon-users"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="today-visitors">0</span>
                    <span class="counter-label">{{ i18n "today_visitors" }}</span>
                </div>
            </div>
            
            <div class="counter-divider"></div>

            <div class="counter-item">
                <svg width="28" height="28" aria-hidden="true">
                    <use href="#icon-chart"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="week-visitors">0</span>
                    <span class="counter-label">{{ i18n "this_week_visitors" }}</span>
                </div>
            </div>

            <div class="counter-divider"></div>

            <div class="counter-item">
                <svg width="28" height="28" aria-hidden="true">
                    <use href="#icon-chart"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="month-visitors">0</span>
                    <span class="counter-label">{{ i18n "this_month_visitors" }}</span>
                </div>
            </div>

            <div class="counter-divider"></div>

            <div class="counter-item">
                <svg width="28" height="28" aria-hidden="true">
                    <use href="#icon-globe"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="total-visitors">0</span>
                    <span class="counter-label">{{ i18n "total_visitors" }}</span>
                </div>
            </div>

        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {

    /*
     * Your GoatCounter installation.
     *
     * IMPORTANT:
     * This must point to the GoatCounter site that you created
     * for THIS domain/subdomain.
     */
    var goatCounter = 'https://analytics.qu.edu.iq';

    var counterSection =
        document.querySelector('.visitor-counter-section');

    if (!counterSection) {
        return;
    }

    /*
     * Animate a number from 0 to the target.
     */
    function animateCounter(elementId, target, duration) {
        duration = duration || 1200;

        var element = document.getElementById(elementId);

        if (!element) {
            return;
        }

        target = Number(target) || 0;

        if (target === 0) {
            element.textContent = '0';
            return;
        }

        var startTime = null;

        function update(timestamp) {
            if (!startTime) {
                startTime = timestamp;
            }

            var progress = Math.min(
                (timestamp - startTime) / duration,
                1
            );

            /*
             * Ease-out animation.
             */
            var eased = 1 - Math.pow(1 - progress, 3);

            var value = Math.floor(target * eased);

            element.textContent = value.toLocaleString();

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                element.textContent = target.toLocaleString();
            }
        }

        requestAnimationFrame(update);
    }

    /*
     * Format a Date as YYYY-MM-DD.
     *
     * GoatCounter's visitor counter accepts dates in this format.
     */
    function formatDate(date) {
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var day = String(date.getDate()).padStart(2, '0');

        return year + '-' + month + '-' + day;
    }

    /*
     * Get today's date.
     */
    var now = new Date();

    /*
     * Today
     */
    var todayStart = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

    /*
     * This week.
     *
     * Monday = first day of the week.
     */
    var weekStart = new Date(todayStart);

    var day = weekStart.getDay();

    /*
     * JavaScript:
     * Sunday = 0
     * Monday = 1
     * ...
     * Saturday = 6
     */
    var daysFromMonday = (day + 6) % 7;

    weekStart.setDate(
        weekStart.getDate() - daysFromMonday
    );

    /*
     * This month.
     */
    var monthStart = new Date(
        now.getFullYear(),
        now.getMonth(),
        1
    );

    /*
     * GoatCounter TOTAL counter.
     *
     * /counter/TOTAL.json is the public counter endpoint.
     *
     * start/end are supplied as YYYY-MM-DD.
     */
    function makeUrl(startDate) {
        return goatCounter +
            '/counter/TOTAL.json' +
            '?start=' + encodeURIComponent(formatDate(startDate)) +
            '&end=' + encodeURIComponent(formatDate(now));
    }

    /*
     * All-time total.
     */
    var totalUrl =
        goatCounter + '/counter/TOTAL.json';

    /*
     * Fetch a GoatCounter counter.
     */
    function fetchCount(url) {
        return fetch(url, {
            method: 'GET',
            cache: 'no-store'
        })
        .then(function (response) {
            if (!response.ok) {
                throw new Error(
                    'GoatCounter returned HTTP ' +
                    response.status
                );
            }

            return response.json();
        })
        .then(function (data) {

            /*
             * GoatCounter returns:
             *
             * {
             *     "count": "1,234",
             *     "count_unique": "1,234"
             * }
             *
             * count is a formatted string.
             */
            if (!data || typeof data.count === 'undefined') {
                throw new Error(
                    'Invalid GoatCounter response'
                );
            }

            /*
             * Remove thousands separators and convert
             * to a number.
             */
            return Number(
                String(data.count).replace(/,/g, '')
            ) || 0;
        });
    }

    /*
     * Only load the counters when they become visible.
     */
    var observer = new IntersectionObserver(
        function (entries) {

            entries.forEach(function (entry) {

                if (!entry.isIntersecting) {
                    return;
                }

                observer.unobserve(entry.target);

                /*
                 * Request all four counters.
                 */
                Promise.all([
                    fetchCount(makeUrl(todayStart)),
                    fetchCount(makeUrl(weekStart)),
                    fetchCount(makeUrl(monthStart)),
                    fetchCount(totalUrl)
                ])
                .then(function (counts) {

                    animateCounter(
                        'today-visitors',
                        counts[0]
                    );

                    animateCounter(
                        'week-visitors',
                        counts[1]
                    );

                    animateCounter(
                        'month-visitors',
                        counts[2]
                    );

                    animateCounter(
                        'total-visitors',
                        counts[3]
                    );
                })
                .catch(function (error) {

                    /*
                     * Don't show broken/incorrect counters.
                     */
                    console.error(
                        'GoatCounter visitor counter:',
                        error
                    );

                    counterSection.hidden = true;
                });
            });

        },
        {
            threshold: 0.1
        }
    );

    observer.observe(counterSection);
});
</script>
