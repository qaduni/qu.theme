<section class="visitor-counter-section"
         data-endpoint="https://umami.qu.edu.iq/api/share/{{ hugo.Data.site.global.share_id }}">
    <div class="container">
        <div class="visitor-counter">
            <div class="counter-item">
                <svg width="28" height="28">
                    <use href="#icon-users"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="today-visitors">0</span>
                    <span class="counter-label">{{ i18n "today_visitors" }}</span>
                </div>
            </div>
            <div class="counter-divider"></div>
            <div class="counter-item">
                <svg width="28" height="28">
                    <use href="#icon-chart"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="total-visitors">0</span>
                    <span class="counter-label">{{ i18n "total_visitors" }}</span>
                </div>
            </div>
            <div class="counter-divider"></div>
            <div class="counter-item">
                <svg width="28" height="28">
                    <use href="#icon-globe"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="online-visitors">0</span>
                    <span class="counter-label">{{ i18n "online_now" }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var counterSection = document.querySelector('.visitor-counter-section');
        if (!counterSection) return;

        function animateCounter(elementId, target, duration) {
            duration = duration || 2000;
            var element = document.getElementById(elementId);
            if (!element) return;
            var start = 0;
            var increment = target / (duration / 16);
            var current = start;

            function updateCounter() {
                current += increment;
                if (current < target) {
                    element.textContent = Math.floor(current).toLocaleString();
                    requestAnimationFrame(updateCounter);
                } else {
                    element.textContent = target.toLocaleString();
                }
            }

            updateCounter();
        }

        var baseUrl = counterSection.dataset.endpoint;
        if (!baseUrl) {
            counterSection.hidden = true;
            return;
        }

        baseUrl = baseUrl.replace(/\/$/, '');

        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    observer.unobserve(entry.target);

                    var now = Date.now();
                    var startOfDay = new Date().setHours(0, 0, 0, 0);
                    var siteCreationDate = new Date('2020-01-01').getTime();

                    // When hitting /api/share/{shareId}, the endpoints are:
                    // /stats?startAt=...&endAt=...
                    // /active
                    var todayUrl = baseUrl + '/stats?startAt=' + startOfDay + '&endAt=' + now;
                    var totalUrl = baseUrl + '/stats?startAt=' + siteCreationDate + '&endAt=' + now;
                    var activeUrl = baseUrl + '/active';

                    Promise.all([
                        fetch(todayUrl).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
                        fetch(totalUrl).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
                        fetch(activeUrl).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                    ])
                    .then(function (results) {
                        var todayData = results[0];
                        var totalData = results[1];
                        var activeData = results[2];

                        function parseStat(data, key) {
                            if (!data) return 0;
                            if (typeof data[key] === 'number') return data[key];
                            if (data[key] && typeof data[key].value === 'number') return data[key].value;
                            return 0;
                        }

                        function parseActive(data) {
                            if (!data) return 0;
                            if (typeof data === 'number') return data;
                            if (typeof data.visitors === 'number') return data.visitors;
                            if (typeof data.x === 'number') return data.x;
                            if (Array.isArray(data) && data.length > 0) {
                                var item = data[0];
                                return item.y || item.x || item.visitors || 0;
                            }
                            return 0;
                        }

                        var todayVisitors = parseStat(todayData, 'visitors') || parseStat(todayData, 'pageviews');
                        var totalVisitors = parseStat(totalData, 'visitors') || parseStat(totalData, 'pageviews');
                        var onlineVisitors = parseActive(activeData);

                        animateCounter('today-visitors', todayVisitors);
                        animateCounter('total-visitors', totalVisitors);
                        animateCounter('online-visitors', onlineVisitors);
                    })
                    .catch(function () {
                        counterSection.hidden = true;
                    });
                }
            });
        }, { threshold: 0.5 });

        observer.observe(counterSection);
    });
</script>
