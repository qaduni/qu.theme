<section class="visitor-counter-section" data-endpoint="{{ hugo.Data.site.global.visitor_counter_endpoint }}">
    <div class="container">
        <div class="visitor-counter">
            <div class="counter-item">
                <svg width="28" height="28">
                    <use href="#icon-users"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="today-visitors">0</span>
                    <span class="counter-label">{{ i18n "today_visitors" }}</span>
                </div>
            </div>
            <div class="counter-divider"></div>
            <div class="counter-item">
                <svg width="28" height="28">
                    <use href="#icon-chart"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="total-visitors">0</span>
                    <span class="counter-label">{{ i18n "total_visitors" }}</span>
                </div>
            </div>
            <div class="counter-divider"></div>
            <div class="counter-item">
                <svg width="28" height="28">
                    <use href="#icon-globe"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="online-visitors">0</span>
                    <span class="counter-label">{{ i18n "online_now" }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var counterSection = document.querySelector('.visitor-counter-section');
        if (!counterSection) return;

        function animateCounter(elementId, target, duration) {
            duration = duration || 2000;
            var element = document.getElementById(elementId);
            if (!element) return;
            var start = 0;
            var increment = target / (duration / 16);
            var current = start;

            function updateCounter() {
                current += increment;
                if (current < target) {
                    element.textContent = Math.floor(current).toLocaleString();
                    requestAnimationFrame(updateCounter);
                } else {
                    element.textContent = target.toLocaleString();
                }
            }

            updateCounter();
        }

        var baseUrl = counterSection.dataset.endpoint;
        if (!baseUrl) {
            counterSection.hidden = true;
            return;
        }

        // Strip trailing slash if present
        baseUrl = baseUrl.replace(/\/$/, '');

        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    observer.unobserve(entry.target);

                    var now = Date.now();
                    var startOfDay = new Date().setHours(0, 0, 0, 0);
                    var siteCreationDate = new Date('2020-01-01').getTime(); // Adjust site start date as needed

                    // Umami API endpoints:
                    // 1. Today's stats: /stats?startAt=...&endAt=...
                    // 2. All-time stats: /stats?startAt=...&endAt=...
                    // 3. Online visitors now: /active
                    var todayUrl = baseUrl + '/stats?startAt=' + startOfDay + '&endAt=' + now;
                    var totalUrl = baseUrl + '/stats?startAt=' + siteCreationDate + '&endAt=' + now;
                    var activeUrl = baseUrl + '/active';

                    Promise.all([
                        fetch(todayUrl).then(function (r) { return r.json(); }),
                        fetch(totalUrl).then(function (r) { return r.json(); }),
                        fetch(activeUrl).then(function (r) { return r.json(); })
                    ])
                    .then(function (results) {
                        var todayData = results[0];
                        var totalData = results[1];
                        var activeData = results[2];

                        // Umami stats output: { visitors: { value: X }, pageviews: { value: Y } }
                        // Umami active output: { visitors: Z } or array format depending on Umami version
                        var todayVisitors = (todayData.visitors && todayData.visitors.value) || 0;
                        var totalVisitors = (totalData.visitors && totalData.visitors.value) || 0;
                        var onlineVisitors = (typeof activeData.visitors === 'number') 
                            ? activeData.visitors 
                            : (activeData[0] ? activeData[0].x || 0 : 0);

                        animateCounter('today-visitors', todayVisitors);
                        animateCounter('total-visitors', totalVisitors);
                        animateCounter('online-visitors', onlineVisitors);
                    })
                    .catch(function () {
                        counterSection.hidden = true;
                    });
                }
            });
        }, { threshold: 0.5 });

        observer.observe(counterSection);
    });
</script>
