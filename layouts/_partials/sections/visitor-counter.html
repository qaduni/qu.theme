<section class="visitor-counter-section">
    <div class="container">
        <div class="visitor-counter">
            <div class="counter-item">
                <svg width="28" height="28" aria-hidden="true">
                    <use href="#icon-users"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="today-visitors">0</span>
                    <span class="counter-label">{{ i18n "today_visitors" }}</span>
                </div>
            </div>
            
            <div class="counter-divider"></div>

            <div class="counter-item">
                <svg width="28" height="28" aria-hidden="true">
                    <use href="#icon-chart"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="week-visitors">0</span>
                    <span class="counter-label">{{ i18n "this_week_visitors" }}</span>
                </div>
            </div>

            <div class="counter-divider"></div>

            <div class="counter-item">
                <svg width="28" height="28" aria-hidden="true">
                    <use href="#icon-chart"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="month-visitors">0</span>
                    <span class="counter-label">{{ i18n "this_month_visitors" }}</span>
                </div>
            </div>

            <div class="counter-divider"></div>

            <div class="counter-item">
                <svg width="28" height="28" aria-hidden="true">
                    <use href="#icon-globe"></use>
                </svg>
                <div class="counter-content">
                    <span class="counter-number" id="total-visitors">0</span>
                    <span class="counter-label">{{ i18n "total_visitors" }}</span>
                </div>
            </div>

        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var counterSection = document.querySelector(
        '.visitor-counter-section'
    );

    if (!counterSection) {
        return;
    }

    var goatCounter = 'https://analytics.qu.edu.iq';

    function animateCounter(elementId, target, duration) {

        duration = duration || 1200;

        var element = document.getElementById(elementId);

        if (!element) {
            return;
        }

        target = Number(target) || 0;

        if (target === 0) {
            element.textContent = '0';
            return;
        }

        var startTime = null;

        function update(timestamp) {

            if (!startTime) {
                startTime = timestamp;
            }

            var progress = Math.min(
                (timestamp - startTime) / duration,
                1
            );

            /*
             * Ease-out animation.
             */
            var eased = 1 - Math.pow(1 - progress, 3);

            var value = Math.floor(target * eased);

            element.textContent = value.toLocaleString();

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                element.textContent = target.toLocaleString();
            }
        }

        requestAnimationFrame(update);
    }

    /*
     * Fetch a public GoatCounter counter.
     */
    function fetchCount(url) {

        return fetch(url, {
            method: 'GET',
            cache: 'no-store'
        })
        .then(function (response) {

            if (!response.ok) {
                throw new Error(
                    'GoatCounter returned HTTP ' +
                    response.status
                );
            }

            return response.json();
        })
        .then(function (data) {

            if (!data ||
                typeof data.count === 'undefined') {

                throw new Error(
                    'Invalid GoatCounter response'
                );
            }

            /*
             * GoatCounter returns count as a formatted string,
             * for example:
             *
             * "1"
             * "1,234"
             */
            return Number(
                String(data.count).replace(/,/g, '')
            ) || 0;
        });
    }

    /*
     * Create today's date in YYYY-MM-DD format.
     *
     * This uses the visitor's local timezone, which is appropriate
     * for the public website counter.
     */
    function getToday() {

        var date = new Date();

        var year = date.getFullYear();

        var month = String(
            date.getMonth() + 1
        ).padStart(2, '0');

        var day = String(
            date.getDate()
        ).padStart(2, '0');

        return year + '-' + month + '-' + day;
    }

    /*
     * Public GoatCounter counter URLs.
     *
     * Today  → start=today's date
     * Week   → start=week
     * Month  → start=month
     * Total  → no date restriction
     */
    var todayUrl =
        goatCounter +
        '/counter/TOTAL.json?start=' +
        encodeURIComponent(getToday());

    var weekUrl =
        goatCounter +
        '/counter/TOTAL.json?start=week';

    var monthUrl =
        goatCounter +
        '/counter/TOTAL.json?start=month';

    var totalUrl =
        goatCounter +
        '/counter/TOTAL.json';

    /*
     * Only request the counters when the section is visible.
     */
    var observer = new IntersectionObserver(
        function (entries) {

            entries.forEach(function (entry) {

                if (!entry.isIntersecting) {
                    return;
                }

                observer.unobserve(entry.target);

                Promise.all([
                    fetchCount(todayUrl),
                    fetchCount(weekUrl),
                    fetchCount(monthUrl),
                    fetchCount(totalUrl)
                ])
                .then(function (counts) {

                    animateCounter(
                        'today-visitors',
                        counts[0]
                    );

                    animateCounter(
                        'week-visitors',
                        counts[1]
                    );

                    animateCounter(
                        'month-visitors',
                        counts[2]
                    );

                    animateCounter(
                        'total-visitors',
                        counts[3]
                    );
                })
                .catch(function (error) {

                    console.error(
                        'GoatCounter visitor counter:',
                        error
                    );

                    /*
                     * Hide the entire counter if GoatCounter
                     * cannot be reached.
                     */
                    counterSection.hidden = true;
                });

            });

        },
        {
            threshold: 0.1
        }
    );

    observer.observe(counterSection);

});
</script>
