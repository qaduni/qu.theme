<div class="table-container">
  <table{{ if .Attributes }}{{ range $k, $v := .Attributes }}{{ if ne $k "class" }} {{ $k }}="{{ $v }}"{{ end }}{{ end }}{{ end }} class="content-table{{ with .Attributes }}{{ with index . "class" }} {{ . }}{{ end }}{{ end }}">
    {{- with .THead }}
      <thead>
        {{- range . }}
          <tr>
            {{- range . }}
              <th{{ with .Alignment }} class="text-{{ . }}" style="text-align: {{ . }};"{{ end }}>
                {{- .Text -}}
              </th>
            {{- end }}
          </tr>
        {{- end }}
      </thead>
    {{- end }}
    {{- with .TBody }}
      <tbody>
        {{- range . }}
          <tr>
            {{- range . }}
              <td{{ with .Alignment }} class="text-{{ . }}" style="text-align: {{ . }};"{{ end }}>
                {{- .Text -}}
              </td>
            {{- end }}
          </tr>
        {{- end }}
      </tbody>
    {{- end }}
  </table>
</div>
